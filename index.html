<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Training">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4CAF50" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e1e1e"  media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Training Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #222; }
        h2 { font-size: 18px; margin-bottom: 14px; color: #444; }
        .label-sm { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #aaa; margin: 14px 0 6px; text-transform: uppercase; }

        /* Alert box */
        .alert-box {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
            border-left: 4px solid #e91e63;
            background: #fce4ec;
            color: #880e4f;
        }

        /* Training buttons */
        .btn {
            display: block; width: 100%;
            padding: 14px 16px;
            margin: 6px 0;
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
            -webkit-appearance: none;
            text-align: left;
            position: relative;
        }
        .btn:active { transform: scale(0.98); opacity: 0.88; }
        .btn .sub { font-size: 12px; font-weight: 400; opacity: 0.8; display: block; margin-top: 2px; }
        .btn .badge {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
            background: rgba(255,255,255,0.25); color: white;
            padding: 2px 7px; border-radius: 20px;
        }
        .btn-push { background: #1976D2; color: white; }
        .btn-pull { background: #7B1FA2; color: white; }
        .btn-legs { background: #388E3C; color: white; }
        .btn-core { background: #F57C00; color: white; }
        .btn-rest { background: #b08080; color: white; }
        .btn-ghost { background: #f0f0f0; color: #444; }

        /* Last training info */
        .last-training-box {
            display: flex; align-items: center; gap: 10px;
            background: #f0f0f0; border-radius: 8px;
            padding: 10px 14px; margin-bottom: 16px;
        }
        .last-training-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; color: #aaa; white-space: nowrap; }
        .last-training-type { font-size: 14px; font-weight: 700; flex: 1; }
        .last-training-date { font-size: 12px; color: #999; white-space: nowrap; }

        /* Done card */
        .done-chip {
            display: inline-block;
            padding: 10px 18px; border-radius: 30px;
            font-size: 18px; font-weight: 700; color: white;
            margin-bottom: 14px;
        }

        /* Nav */
        .nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .nav-btn {
            flex: 1; padding: 15px; border: none;
            background: white; font-size: 14px; cursor: pointer;
            -webkit-appearance: none;
        }
        .nav-btn.active { background: #4CAF50; color: white; font-weight: 600; }
        .view { display: none; }
        .view.active { display: block; }

        /* Log */
        .log-entry {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 0; border-bottom: 1px solid #f0f0f0;
        }
        .log-entry:last-child { border-bottom: none; }
        .log-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .log-date { font-size: 13px; color: #999; min-width: 65px; }
        .log-type { font-size: 15px; font-weight: 500; flex: 1; }
        .log-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .icon-btn {
            width: 32px; height: 32px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 15px; display: flex;
            align-items: center; justify-content: center;
            background: #f0f0f0; color: #666;
            -webkit-appearance: none;
        }
        .icon-btn:active { opacity: 0.7; }
        .icon-btn.del { background: #fce4ec; color: #c62828; }

        /* Inline edit row */
        .edit-row {
            display: flex; flex-wrap: wrap; gap: 6px;
            padding: 10px 0 6px; border-bottom: 1px solid #f0f0f0;
        }
        .edit-chip {
            padding: 6px 12px; border: none; border-radius: 20px;
            font-size: 13px; font-weight: 600; color: white; cursor: pointer;
            -webkit-appearance: none;
        }
        .edit-chip:active { opacity: 0.8; }
        .edit-cancel {
            padding: 6px 12px; border: none; border-radius: 20px;
            font-size: 13px; background: #eee; color: #555; cursor: pointer;
            -webkit-appearance: none;
        }

        /* Offline */
        .offline-bar {
            display: none; background: #f44336; color: white;
            text-align: center; padding: 7px; font-size: 12px;
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
        }
        .offline-bar.show { display: block; }

        /* Sync */
        .sync-id-box { font-family: monospace; font-size: 12px; word-break: break-all;
            background: #f5f5f5; border-radius: 8px; padding: 12px; flex: 1; line-height: 1.6; color: #555; }
        .sync-status { font-size: 13px; margin-bottom: 16px; font-weight: 500; }
        .sync-input { width: 100%; border: 1px solid #ddd; border-radius: 8px;
            padding: 10px 12px; font-size: 12px; margin-bottom: 8px; font-family: monospace;
            background: white; color: #333; -webkit-appearance: none; }
        .sync-divider { height: 1px; background: #f0f0f0; margin: 20px 0; }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 8px 18px; border-radius: 20px;
            font-size: 13px; z-index: 9999; pointer-events: none; white-space: nowrap; }

        /* Dark Mode */
        @media (prefers-color-scheme: dark) {
            body            { background: #121212; color: #e0e0e0; }
            h1              { color: #e0e0e0; }
            h2              { color: #bbb; }
            .label-sm       { color: #666; }
            .card           { background: #1e1e1e; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
            .alert-box      { background: #3a0d1e; color: #f48fb1; border-color: #c2185b; }
            .btn-ghost      { background: #2a2a2a; color: #ccc; }
            .last-training-box { background: #2a2a2a; }
            .last-training-date { color: #666; }
            .nav            { background: #1e1e1e; box-shadow: 0 -2px 8px rgba(0,0,0,0.4); }
            .nav-btn        { background: #1e1e1e; color: #aaa; }
            .nav-btn.active { background: #2e7d32; color: white; }
            .log-entry      { border-bottom-color: #2a2a2a; }
            .log-date       { color: #666; }
            .log-type       { color: #e0e0e0; }
            .icon-btn       { background: #2a2a2a; color: #aaa; }
            .icon-btn.del   { background: #3a0d0d; color: #ef9a9a; }
            .edit-cancel    { background: #2a2a2a; color: #aaa; }
            .sync-id-box    { background: #2a2a2a; color: #aaa; }
            .sync-input     { background: #2a2a2a; color: #e0e0e0; border-color: #444; }
            .sync-divider   { background: #2a2a2a; }
            .toast          { background: #555; }
        }
    </style>
</head>
<body>
    <div class="offline-bar" id="offlineBar">Offline – Daten lokal gespeichert</div>

    <div class="container">
        <h1>Training Tracker <span style="font-size:13px;font-weight:400;color:#888">v3.0</span></h1>

        <div id="decisionView" class="view active">
            <div class="card" id="decisionCard"></div>
        </div>

        <div id="logView" class="view">
            <div class="card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
                    <h2 style="margin:0">Log</h2>
                    <button class="icon-btn" onclick="startAdd()" style="width:auto;padding:6px 12px;font-size:13px;font-weight:600;background:#4CAF50;color:white">+ Nachtragen</button>
                </div>
                <div id="addForm" style="display:none"></div>
                <div id="logContent"></div>
            </div>
        </div>

        <div id="syncView" class="view">
            <div class="card" id="syncCard"></div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="showView('decision')">Heute</button>
        <button class="nav-btn" onclick="showView('log')">Log</button>
        <button class="nav-btn" onclick="showView('sync')">Sync</button>
    </div>

    <script>
        const T = { PUSH:'Push', PULL:'Pull', LEGS:'Legs', CORE:'BP-Cardio', REST:'Pause' };
        const ALL_TYPES = [T.PUSH, T.PULL, T.LEGS, T.CORE, T.REST];
        const PPL = [T.PUSH, T.PULL, T.LEGS];

        const COLOR = {
            [T.PUSH]:'#1976D2', [T.PULL]:'#7B1FA2', [T.LEGS]:'#388E3C',
            [T.CORE]:'#F57C00', [T.REST]:'#b08080'
        };
        const SUB = {
            [T.PUSH]:'Brust · Schultern · Trizeps',
            [T.PULL]:'Rücken · Bizeps',
            [T.LEGS]:'Beine · Gesäß',
            [T.CORE]:'Bauch · Po · leichtes Cardio',
            [T.REST]:'Erholung'
        };
        const BTN_CLS = {
            [T.PUSH]:'btn-push', [T.PULL]:'btn-pull', [T.LEGS]:'btn-legs',
            [T.CORE]:'btn-core', [T.REST]:'btn-rest'
        };

        // ── Supabase ──────────────────────────────────────────────────────
        const SUPABASE_URL = 'https://rysxgdqrirgiyupffzyd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_KrbL12Ni8KhRQ4TIGFcwlA_x-jP4zhW';
        let db = null;
        let syncStatus = ''; // '' | 'syncing' | 'ok' | 'error'

        function getUserId() {
            let uid = localStorage.getItem('ppl_user_id');
            if (!uid) { uid = crypto.randomUUID(); localStorage.setItem('ppl_user_id', uid); }
            return uid;
        }

        async function initSupabase() {
            if (typeof window.supabase === 'undefined') return;
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            await syncFromSupabase();
        }

        async function syncFromSupabase() {
            if (!db) return;
            syncStatus = 'syncing'; updateSyncView();
            try {
                const { data, error } = await db.from('training_log')
                    .select('date, type, ts').eq('user_id', getUserId());
                if (error) throw error;
                const merged = {};
                [...getAll(), ...(data || [])].forEach(e => {
                    if (!merged[e.date] || e.ts > merged[e.date].ts)
                        merged[e.date] = { date: e.date, type: e.type, ts: e.ts };
                });
                const sorted = Object.values(merged).sort((a, b) => b.date.localeCompare(a.date));
                localStorage.setItem('ppl_log', JSON.stringify(sorted));
                syncStatus = 'ok'; updateSyncView();
                render(); updateLog();
            } catch (e) { console.warn('sync failed', e); syncStatus = 'error'; updateSyncView(); }
        }

        async function pushToSupabase(entries) {
            if (!db || !entries.length) return;
            try {
                const rows = entries.map(e => ({
                    user_id: getUserId(), date: e.date, type: e.type, ts: e.ts
                }));
                await db.from('training_log').upsert(rows, { onConflict: 'user_id,date' });
                syncStatus = 'ok'; updateSyncView();
            } catch (e) { console.warn('push failed', e); syncStatus = 'error'; updateSyncView(); }
        }

        async function deleteFromSupabase(date) {
            if (!db) return;
            try {
                await db.from('training_log').delete()
                    .eq('user_id', getUserId()).eq('date', date);
            } catch (e) { console.warn('delete failed', e); }
        }

        async function importUserId() {
            const newUid = document.getElementById('importIdInput')?.value?.trim();
            if (!newUid || newUid.length < 10) { showToast('Ungültige Sync-ID'); return; }
            if (!db) { showToast('Offline'); return; }
            if (!confirm('Alle lokalen Daten werden überschrieben. Fortfahren?')) return;
            localStorage.setItem('ppl_user_id', newUid);
            localStorage.setItem('ppl_log', '[]');
            await syncFromSupabase();
            const n = getAll().length;
            showToast(n > 0 ? `${n} Einträge importiert ✓` : 'Keine Daten gefunden');
        }

        function updateSyncView() {
            const card = document.getElementById('syncCard');
            if (!card) return;
            const uid = getUserId();
            const statusText = syncStatus === 'syncing' ? '⏳ Synchronisiert...'
                : syncStatus === 'ok'    ? '✓ Synchronisiert'
                : syncStatus === 'error' ? '⚠ Sync-Fehler'
                : '– Noch nicht synchronisiert';
            const statusColor = syncStatus === 'ok' ? '#2e7d32'
                : syncStatus === 'error' ? '#c62828' : '#888';
            card.innerHTML = `
                <h2>Cloud Sync</h2>
                <p class="sync-status" style="color:${statusColor}">${statusText}</p>
                <p class="label-sm">Deine Sync-ID</p>
                <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px">
                    <div class="sync-id-box">${uid}</div>
                    <button class="icon-btn" onclick="copyUserId()" title="Kopieren" style="flex-shrink:0">⎘</button>
                </div>
                <button class="btn btn-ghost" onclick="syncFromSupabase()">↻ Jetzt synchronisieren</button>
                <div class="sync-divider"></div>
                <p class="label-sm">Neues Gerät einrichten</p>
                <p style="font-size:12px;color:#999;margin-bottom:10px">Sync-ID vom anderen Gerät eingeben, um Daten zu importieren.</p>
                <input class="sync-input" id="importIdInput" type="text" placeholder="Sync-ID einfügen…">
                <button class="btn btn-ghost" onclick="importUserId()">Importieren</button>`;
        }

        async function copyUserId() {
            const uid = getUserId();
            try {
                await navigator.clipboard.writeText(uid);
                showToast('Sync-ID kopiert ✓');
            } catch {
                // iOS Standalone fallback
                prompt('Sync-ID (alles auswählen und kopieren):', uid);
            }
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        // ── Storage ──────────────────────────────────────────────────────
        function getAll() {
            try {
                const data = JSON.parse(localStorage.getItem('ppl_log') || '[]');
                return data.sort((a, b) => b.date.localeCompare(a.date));
            } catch { return []; }
        }
        function saveAll(a) {
            const sorted = [...a].sort((x, y) => y.date.localeCompare(x.date));
            localStorage.setItem('ppl_log', JSON.stringify(sorted));
            pushToSupabase(sorted);
        }
        function todayStr() { return new Date().toISOString().split('T')[0]; }
        function getTodayEntry() { return getAll().find(t => t.date === todayStr()) || null; }
        // Empfehlung basiert immer auf Einträgen VOR heute
        function getLastEntry() { const t = todayStr(); return getAll().find(e => e.date < t) || null; }
        function getLastPPL() { const t = todayStr(); return getAll().find(e => e.date < t && PPL.includes(e.type)) || null; }
        function nextPPL(type) { return PPL[(PPL.indexOf(type) + 1) % PPL.length]; }
        function getYesterdayType() {
            const d = new Date(); d.setDate(d.getDate() - 1);
            const ys = d.toISOString().split('T')[0];
            return getAll().find(e => e.date === ys)?.type || null;
        }

        // Die am längsten nicht ausgeführte PPL-Einheit (berücksichtigt übersprungene)
        function getNextPPLType() {
            const today = todayStr();
            const all = getAll().filter(e => e.date < today);
            const lastDate = {};
            PPL.forEach(type => {
                const e = all.find(e => e.type === type);
                lastDate[type] = e ? e.date : ''; // '' sortiert vor jedem Datum → nie gemacht = überfällig
            });
            return PPL.slice().sort((a, b) => lastDate[a].localeCompare(lastDate[b]))[0];
        }

        function logTraining(type) {
            const today = todayStr();
            const all = getAll().filter(t => t.date !== today);
            all.unshift({ date: today, type, ts: Date.now() });
            saveAll(all);
            render(); updateLog();
        }

        // ── Recommendation ───────────────────────────────────────────────
        function getRecommendation() {
            const last = getLastEntry();
            if (!last) return { primary: T.PUSH, warn: false };
            const ltype = last.type;
            const next = getNextPPLType();
            // Nach Legs: direkt zur nächsten überfälligen PPL-Einheit, kein BP-Cardio
            if (ltype === T.LEGS)        return { primary: next, warn: true };
            // Nach Push/Pull: Erholungstag (BP-Cardio)
            if (PPL.includes(ltype))     return { primary: T.CORE, warn: false };
            // Nach BP-Cardio/Pause: nächste überfällige PPL-Einheit
            return { primary: next, warn: false };
        }

        // ── Today view ───────────────────────────────────────────────────
        function render() {
            const card = document.getElementById('decisionCard');
            const today = getTodayEntry();
            const rec = getRecommendation();

            let h = '';

            if (today) {
                h += `<h2>Heute erledigt</h2>
                    <div class="done-chip" style="background:${COLOR[today.type]}">${today.type}</div>
                    <p style="font-size:13px;color:#999;margin-bottom:16px">${SUB[today.type]}</p>
                    ${renderLastTraining()}
                    <button class="btn btn-ghost" onclick="resetToday()">Eintrag ändern</button>`;
            } else {
                h += `<h2>Was machst du heute?</h2>${renderLastTraining()}`;

                if (rec.warn) {
                    h += `<div class="alert-box">Nach Legs kein BP-Cardio!</div>`;
                }

                // Gestern gemachter Typ ist heute gesperrt (Pause immer verfügbar)
                const yt = getYesterdayType();
                const available = ALL_TYPES.filter(t => t === T.REST || t !== yt);

                // Empfehlung anpassen falls gesperrter Typ empfohlen wird
                let primary = rec.primary;
                if (!available.includes(primary)) {
                    primary = available.find(t => t !== T.REST) || T.REST;
                }

                // Empfohlen
                h += `<div class="label-sm">Empfohlen</div>
                    <button class="btn ${BTN_CLS[primary]}" onclick="logTraining('${primary}')">
                        ${primary}
                        <span class="sub">${SUB[primary]}</span>
                        <span class="badge">✓ Plan</span>
                    </button>`;

                // Alle anderen Optionen (nicht Empfehlung) – gesperrte verblass anzeigen
                const others = ALL_TYPES.filter(t => t !== primary);
                h += `<div class="label-sm">Andere Option</div>`;
                others.forEach(t => {
                    const blockedYesterday = t !== T.REST && t === yt;
                    const blockedWarn = rec.warn && t === T.CORE;
                    const disabled = blockedYesterday || blockedWarn;
                    const badge = blockedYesterday ? 'gestern' : blockedWarn ? 'gesperrt' : '';
                    h += `<button class="btn ${BTN_CLS[t]}"
                        ${disabled ? 'style="opacity:0.35;pointer-events:none"' : `onclick="logTraining('${t}')"`}>
                        ${t}
                        <span class="sub">${SUB[t]}</span>
                        ${badge ? `<span class="badge">${badge}</span>` : ''}
                    </button>`;
                });
            }

            card.innerHTML = h;
        }

        function resetToday() {
            const today = todayStr();
            deleteFromSupabase(today);
            const sorted = getAll().filter(t => t.date !== today);
            localStorage.setItem('ppl_log', JSON.stringify(sorted));
            render(); updateLog();
        }

        // ── Last training info ───────────────────────────────────────────
        function renderLastTraining() {
            const last = getLastEntry();
            if (!last) return '';
            const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];
            const d = new Date(last.date);
            const dateLabel = `${days[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`;
            return `<div class="last-training-box">
                <span class="last-training-label">Zuletzt</span>
                <span class="last-training-type" style="color:${COLOR[last.type]}">${last.type}</span>
                <span class="last-training-date">${dateLabel}</span>
            </div>`;
        }

        // ── Log view ─────────────────────────────────────────────────────
        let editingDate = null;

        function updateLog() {
            const all = getAll();
            const lc = document.getElementById('logContent');
            if (!all.length) {
                lc.innerHTML = '<p style="text-align:center;color:#ccc;padding:24px 0">Noch keine Einträge</p>';
                return;
            }
            const days = ['So','Mo','Di','Mi','Do','Fr','Sa'];
            let h = '';
            all.forEach(entry => {
                const d = new Date(entry.date);
                const dateLabel = `${days[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`;
                h += `<div class="log-entry">
                    <div class="log-dot" style="background:${COLOR[entry.type]}"></div>
                    <div class="log-date">${dateLabel}</div>
                    <div class="log-type">${entry.type}</div>
                    <div class="log-actions">
                        <button class="icon-btn" onclick="startEdit('${entry.date}')" title="Bearbeiten">✎</button>
                        <button class="icon-btn del" onclick="deleteEntry('${entry.date}')" title="Löschen">✕</button>
                    </div>
                </div>`;
                if (editingDate === entry.date) {
                    h += `<div class="edit-row" style="flex-direction:column;gap:10px">
                        <div style="display:flex;gap:8px;align-items:center">
                            <label style="font-size:13px;color:#666;white-space:nowrap">Datum:</label>
                            <input type="date" id="editDateInput" value="${entry.date}"
                                style="border:1px solid #ddd;border-radius:6px;padding:5px 8px;font-size:14px;flex:1">
                        </div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px">`;
                    ALL_TYPES.forEach(t => {
                        h += `<button class="edit-chip" style="background:${COLOR[t]}"
                            onclick="applyEdit('${entry.date}','${t}')">${t}</button>`;
                    });
                    h += `<button class="edit-cancel" onclick="cancelEdit()">Abbrechen</button>
                        </div></div>`;
                }
            });
            lc.innerHTML = h;
        }

        function startEdit(date) {
            editingDate = date;
            updateLog();
        }
        function cancelEdit() {
            editingDate = null;
            updateLog();
        }
        function applyEdit(oldDate, newType) {
            const newDate = document.getElementById('editDateInput')?.value || oldDate;
            if (newDate !== oldDate) deleteFromSupabase(oldDate);
            const all = getAll()
                .filter(e => e.date !== newDate || e.date === oldDate) // remove collision on new date
                .map(e => e.date === oldDate
                    ? { ...e, date: newDate, type: newType, ts: Date.now() }
                    : e);
            all.sort((a, b) => b.date.localeCompare(a.date));
            saveAll(all);
            editingDate = null;
            updateLog();
            render();
        }
        function deleteEntry(date) {
            deleteFromSupabase(date);
            saveAll(getAll().filter(e => e.date !== date));
            if (editingDate === date) editingDate = null;
            updateLog();
            if (date === todayStr()) render();
        }

        // ── Add past entry ───────────────────────────────────────────────
        function startAdd() {
            const f = document.getElementById('addForm');
            f.style.display = 'block';
            f.innerHTML = `<div style="background:#f9f9f9;border-radius:10px;padding:14px;margin-bottom:14px">
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
                    <label style="font-size:13px;color:#666;white-space:nowrap">Datum:</label>
                    <input type="date" id="newDateInput" value="${todayStr()}"
                        style="border:1px solid #ddd;border-radius:6px;padding:5px 8px;font-size:14px;flex:1">
                </div>
                <p style="font-size:12px;color:#aaa;margin-bottom:8px">Training auswählen:</p>
                <div style="display:flex;flex-wrap:wrap;gap:6px">
                    ${ALL_TYPES.map(t => `<button class="edit-chip" style="background:${COLOR[t]}"
                        onclick="confirmAdd('${t}')">${t}</button>`).join('')}
                    <button class="edit-cancel" onclick="cancelAdd()">Abbrechen</button>
                </div>
            </div>`;
        }
        function confirmAdd(type) {
            const date = document.getElementById('newDateInput')?.value;
            if (!date) return;
            const all = getAll().filter(e => e.date !== date);
            all.push({ date, type, ts: Date.now() });
            all.sort((a, b) => b.date.localeCompare(a.date));
            saveAll(all);
            cancelAdd();
            updateLog();
            render();
        }
        function cancelAdd() {
            const f = document.getElementById('addForm');
            f.style.display = 'none';
            f.innerHTML = '';
        }

        // ── Navigation ───────────────────────────────────────────────────
        function showView(v) {
            document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if (v === 'decision') {
                document.getElementById('decisionView').classList.add('active');
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
                render();
            } else if (v === 'log') {
                document.getElementById('logView').classList.add('active');
                document.querySelectorAll('.nav-btn')[1].classList.add('active');
                updateLog();
            } else if (v === 'sync') {
                document.getElementById('syncView').classList.add('active');
                document.querySelectorAll('.nav-btn')[2].classList.add('active');
                updateSyncView();
            }
        }

        // ── Offline ──────────────────────────────────────────────────────
        window.addEventListener('online', () => {
            document.getElementById('offlineBar').classList.remove('show');
            syncFromSupabase();
        });
        window.addEventListener('offline', () => document.getElementById('offlineBar').classList.add('show'));

        // ── Service Worker ───────────────────────────────────────────────
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                    .then(reg => {
                        // Check for updates on load and every 60s
                        reg.update();
                        setInterval(() => reg.update(), 60000);
                        // Reload when a new SW takes control
                        let refreshing = false;
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            if (!refreshing) { refreshing = true; window.location.reload(); }
                        });
                    }).catch(() => {});
                // Also check on tab focus (covers background PWA wakeup)
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        navigator.serviceWorker.ready.then(reg => reg.update()).catch(() => {});
                    }
                });
            });
        }

        // ── Init ─────────────────────────────────────────────────────────
        render();
        updateLog();
        if (!navigator.onLine) document.getElementById('offlineBar').classList.add('show');
        initSupabase();
    </script>
</body>
</html>
